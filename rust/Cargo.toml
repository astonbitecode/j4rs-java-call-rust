[package]
name = "rustlib"
version = "0.1.0"
authors = ["Aston <astonbitecode@gmail.com>"]
edition = "2018"

[lib]
name = "rustlib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
j4rs = "0.21.0"
j4rs_derive = "0.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11.5"